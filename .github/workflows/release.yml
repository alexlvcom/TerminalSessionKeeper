name: Release installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/TerminalSessionKeeper/TerminalSessionKeeper.csproj
          $version = [string]($project.Project.PropertyGroup | Where-Object { $_.Version }).Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must be v$version"
          }
      - name: Run unit tests
        shell: pwsh
        run: dotnet test tests/TerminalSessionKeeper.Tests/TerminalSessionKeeper.Tests.csproj -c Release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Invalid Inno Setup signature' }
          $process = Start-Process $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/TerminalSessionKeeper-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## \[?' + [regex]::Escape($version) + '\]? - [^\r\n]+\r?\n(?<notes>.*?)(?=^## |\z)'
          $match = [regex]::Match($changelog, $pattern)
          if (!$match.Success) { throw "Missing changelog section for $version" }
          $notes = $match.Groups['notes'].Value.Trim() + "`n`nDownload **TerminalSessionKeeper-Setup.exe** and run it. The installer closes the running app during upgrades and preserves your settings.`n`nSHA-256:`n``````text`n" + (Get-Content dist/SHA256SUMS.txt -Raw).Trim() + "`n```````n"
          $notes | Set-Content release-notes.md -Encoding utf8
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/TerminalSessionKeeper-Setup.exe dist/SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release asset update failed' }
            gh release edit $env:GITHUB_REF_NAME --title "Terminal Session Keeper $env:GITHUB_REF_NAME" --notes-file release-notes.md --latest
          } else {
            gh release create $env:GITHUB_REF_NAME dist/TerminalSessionKeeper-Setup.exe dist/SHA256SUMS.txt --verify-tag --title "Terminal Session Keeper $env:GITHUB_REF_NAME" --notes-file release-notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
    permissions:
      contents: write
